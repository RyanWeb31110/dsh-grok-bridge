# Optional shape for `dsh web` / headless, where you start the process
# and the shell environment is visible. Not the desktop app path.
# Desktop users want examples/cordis.patch.yml (literals).
#
# A row with this id replaces the WHOLE plugin config. Restate every key.
# `name` must stay `dsh-grok-bridge`.
- id: dsh-grok-bridge
  name: dsh-grok-bridge
  config:
    host: !!js process.env.DSH_GROK_BIND ?? '127.0.0.1'
    port: !!js Number(process.env.DSH_GROK_PORT ?? 8791)
    token: !!js process.env.DSH_GROK_TOKEN ?? ''
    storePath: !!js process.env.DSH_GROK_STORE ?? ''
    cwd: !!js process.env.DSH_GROK_CWD ?? ''
    cwdAllowlist: !!js process.env.DSH_GROK_CWD_ALLOWLIST ?? ''
    provider: !!js process.env.DSH_GROK_PROVIDER ?? ''
    model: !!js process.env.DSH_GROK_MODEL ?? ''
    outboundWebhookUrl: !!js process.env.DSH_GROK_OUTBOUND_WEBHOOK_URL ?? ''
    outboundToken: !!js process.env.DSH_GROK_OUTBOUND_TOKEN ?? ''
    outboundHmacSecret: !!js process.env.DSH_GROK_OUTBOUND_HMAC_SECRET ?? ''
    heartbeatMs: !!js Number(process.env.DSH_GROK_HEARTBEAT_MS ?? 0)
    webhookCompleted: !!js process.env.DSH_GROK_WEBHOOK_COMPLETED ?? ''
    webhookFailed: !!js process.env.DSH_GROK_WEBHOOK_FAILED ?? ''
    webhookNeedsApproval: !!js process.env.DSH_GROK_WEBHOOK_NEEDS_APPROVAL ?? ''
    webhookHeartbeat: !!js process.env.DSH_GROK_WEBHOOK_HEARTBEAT ?? ''
    maxBodyBytes: 1048576
    maxTasks: 500
