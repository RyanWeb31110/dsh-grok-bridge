# Desktop (Electron) — primary setup.
# Paste into ~/.dsh/profiles/desktop/cordis.patch.yml.
# The app does not inherit your shell. Do not use launchctl setenv.
#
# A row with this id replaces the WHOLE plugin config. Restate every key.
# `name` must stay `dsh-grok-bridge` or the row is skipped.
# provider and model stay empty so each session follows agent-default-model.
# Replace the three quoted secrets. Do not commit the filled-in file.
- id: dsh-grok-bridge
  name: dsh-grok-bridge
  config:
    host: 127.0.0.1
    port: 8791
    token: 'replace-with-inbound-bearer'
    storePath: ''
    cwd: ''
    cwdAllowlist: ''
    provider: ''
    model: ''
    outboundWebhookUrl: 'http://100.x.x.x:8792/dsh-events'
    outboundToken: 'replace-with-outbound-bearer'
    outboundHmacSecret: 'replace-with-hmac-secret'
    heartbeatMs: 0
    webhookCompleted: ''
    webhookFailed: ''
    webhookNeedsApproval: ''
    webhookHeartbeat: ''
    maxBodyBytes: 1048576
    maxTasks: 500
